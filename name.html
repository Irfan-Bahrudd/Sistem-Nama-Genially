<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- Jockey One -->
<link
    href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap"
    rel="stylesheet"
>

<style>

    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;

        font-family: "Jockey One", sans-serif;

        overflow: hidden;

    }


    * {
        box-sizing: border-box;
    }


    /* =========================================
       INPUT POPUP
       ========================================= */


    #inputMode {

        display: none;

        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;

    }


    .popup {

        width: 95%;
        max-width: 520px;

        padding: 28px 32px 24px;

        text-align: center;

        background: #123e69;

        border: 3px solid #4ca3ef;

        border-radius: 22px;

        box-shadow:
            0 10px 25px rgba(0, 0, 0, 0.35);

        opacity: 0;

        transform: scale(0.85);

        animation:
            popupIn 0.35s ease forwards;

    }


    @keyframes popupIn {

        to {

            opacity: 1;

            transform: scale(1);

        }

    }


    .popup.hide {

        animation:
            popupOut 0.35s ease forwards;

    }


    @keyframes popupOut {

        from {

            opacity: 1;

            transform: scale(1);

        }

        to {

            opacity: 0;

            transform: scale(0.85);

        }

    }


    .popup-title {

        margin-bottom: 18px;

        color: white;

        font-size: 30px;

        line-height: 1.1;

    }


    #nameInput {

        width: 100%;

        padding: 13px 18px;

        font-family: "Jockey One", sans-serif;

        font-size: 23px;

        text-align: center;

        color: #123e69;

        background: white;

        border: 3px solid #4ca3ef;

        border-radius: 14px;

        outline: none;

        transition:
            transform 0.15s ease,
            border-color 0.15s ease;

    }


    #nameInput::placeholder {

        color: #7990a8;

    }


    #nameInput:focus {

        border-color: #ffc928;

        transform: scale(1.015);

    }


    #saveButton {

        margin-top: 17px;

        padding: 11px 32px;

        font-family: "Jockey One", sans-serif;

        font-size: 22px;

        color: #123e69;

        background: #4ca3ef;

        border: none;

        border-radius: 30px;

        cursor: pointer;

        transition:
            transform 0.15s ease;

    }


    #saveButton:hover {

        transform: scale(1.05);

    }


    #message {

        height: 24px;

        margin-top: 10px;

        color: #ffc928;

        font-size: 18px;

    }



    /* =========================================
       FINAL NAME DISPLAY
       ========================================= */


    #displayMode {

        display: none;

        width: 100%;

        text-align: center;

    }


    #displayName {

        color: white;

        font-family: "Jockey One", sans-serif;

        font-size: 42px;

        line-height: 1.1;

        word-break: break-word;

    }

</style>

</head>


<body>


<!-- ========================================
     INPUT POPUP
     ======================================== -->


<div id="inputMode">

    <div
        class="popup"
        id="popup"
    >

        <div class="popup-title">

            SILA MASUKKAN NAMA ANDA

        </div>


        <input
            id="nameInput"
            type="text"
            placeholder="Taip nama anda..."
            maxlength="40"
            autocomplete="off"
        >


        <button id="saveButton">

            REKOD NAMA

        </button>


        <div id="message"></div>


    </div>

</div>



<!-- ========================================
     FINAL NAME
     ======================================== -->


<div id="displayMode">

    <div id="displayName"></div>

</div>



<script>

const parameters =
    new URLSearchParams(
        window.location.search
    );


const mode =
    parameters.get("mode");



/* ==========================================
   INPUT MODE
   ========================================== */


if (mode === "input") {


    const inputMode =
        document.getElementById(
            "inputMode"
        );


    const popup =
        document.getElementById(
            "popup"
        );


    const input =
        document.getElementById(
            "nameInput"
        );


    const button =
        document.getElementById(
            "saveButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    inputMode.style.display =
        "flex";


    /*
     * If a name already exists,
     * place it in the input box.
     */

    const existingName =
        localStorage.getItem(
            "playerName"
        );


    if (existingName) {

        input.value =
            existingName;

    }



    function saveName() {


        const playerName =
            input.value.trim();


        /*
         * Prevent blank names.
         */

        if (playerName === "") {

            message.textContent =
                "Sila masukkan nama anda.";

            input.focus();

            return;

        }


        /*
         * Save name.
         */

        localStorage.setItem(
            "playerName",
            playerName
        );


        /*
         * Confirmation.
         */

        message.textContent =
            "✓ NAMA BERJAYA DIREKODKAN";


        /*
         * Wait briefly so player can
         * see the confirmation.
         */

        setTimeout(
            function () {


                /*
                 * Play closing animation.
                 */

                popup.classList.add(
                    "hide"
                );


                /*
                 * After animation finishes,
                 * remove popup completely.
                 */

                setTimeout(
                    function () {

                        inputMode.style.display =
                            "none";

                    },
                    350
                );


            },
            700
        );

    }



    /*
     * Button click.
     */

    button.addEventListener(
        "click",
        saveName
    );



    /*
     * Enter key.
     */

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                saveName();

            }

        }
    );


}



/* ==========================================
   DISPLAY MODE
   ========================================== */


if (mode === "display") {


    document.getElementById(
        "displayMode"
    ).style.display =
        "block";


    const playerName =
        localStorage.getItem(
            "playerName"
        );


    const display =
        document.getElementById(
            "displayName"
        );


    if (playerName) {

        display.textContent =
            playerName;

    }

}

</script>


</body>

</html>
