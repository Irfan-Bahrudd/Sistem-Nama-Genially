<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- Jockey One -->
<link
    href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap"
    rel="stylesheet"
>

<style>

    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;

        font-family: "Jockey One", sans-serif;

        overflow: hidden;

    }


    * {
        box-sizing: border-box;
    }


    /* =========================================
       INPUT MODE
       ========================================= */

    #inputMode {

        display: none;

        position: relative;

        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;

        overflow: hidden;

    }


    /* =========================================
       DARK BACKDROP
       ========================================= */

    #inputMode::before {

        content: "";

        position: absolute;

        inset: 0;

        background: rgba(0, 0, 0, 0.24);

        opacity: 0;

        animation: backdropIn 0.35s ease forwards;

        z-index: 0;

    }


    #inputMode.closing::before {

        animation: backdropOut 0.35s ease forwards;

    }


    @keyframes backdropIn {

        to {

            opacity: 1;

        }

    }


    @keyframes backdropOut {

        from {

            opacity: 1;

        }

        to {

            opacity: 0;

        }

    }


    /* =========================================
       POPUP
       ========================================= */

    .popup {

        position: relative;

        z-index: 1;

        width: 95%;
        max-width: 520px;

        padding: 32px 32px 26px;

        text-align: center;

        background: #123e69;

        border: 3px solid #4ca3ef;

        border-radius: 22px;

        box-shadow:
            0 10px 25px rgba(0, 0, 0, 0.35);

        opacity: 0;

        transform: scale(0.85);

        animation:
            popupIn 0.35s ease forwards;

    }


    @keyframes popupIn {

        to {

            opacity: 1;

            transform: scale(1);

        }

    }


    /* =========================================
       TITLE
       ========================================= */

    .popup-title {

        margin-bottom: 18px;

        padding: 0 20px;

        color: white;

        font-size: 30px;

        line-height: 1.1;

    }


    /* =========================================
       NAME INPUT
       ========================================= */

    #nameInput {

        width: 100%;

        padding: 13px 18px;

        font-family: "Jockey One", sans-serif;

        font-size: 23px;

        text-align: center;

        color: #123e69;

        background: white;

        border: 3px solid #4ca3ef;

        border-radius: 14px;

        outline: none;

        transition:
            transform 0.15s ease,
            border-color 0.15s ease;

    }


    #nameInput::placeholder {

        color: #7990a8;

    }


    #nameInput:focus {

        border-color: #ffc928;

        transform: scale(1.015);

    }


    /* =========================================
       CONTINUE BUTTON
       ========================================= */

    #continueButton {

        margin-top: 17px;

        padding: 11px 36px;

        font-family: "Jockey One", sans-serif;

        font-size: 22px;

        color: #123e69;

        background: #4ca3ef;

        border: none;

        border-radius: 30px;

        cursor: pointer;

        transition:
            transform 0.15s ease,
            background 0.15s ease;

    }


    #continueButton:hover {

        transform: scale(1.05);

        background: #ffc928;

    }


    /* =========================================
       MESSAGE
       ========================================= */

    #message {

        height: 24px;

        margin-top: 10px;

        color: #ffc928;

        font-size: 18px;

    }


    /* =========================================
       POPUP EXIT ANIMATION
       ========================================= */

    .popup.hide {

        animation:
            popupOut 0.35s ease forwards;

    }


    @keyframes popupOut {

        from {

            opacity: 1;

            transform: scale(1);

        }

        to {

            opacity: 0;

            transform: scale(0.85);

        }

    }


    /* =========================================
       FINAL DISPLAY MODE
       ========================================= */

    #displayMode {

        display: none;

        width: 100%;

        text-align: center;

    }


    #displayName {

        color: white;

        font-family: "Jockey One", sans-serif;

        font-size: 42px;

        line-height: 1.1;

        word-break: break-word;

    }

</style>

</head>


<body>


<!-- =========================================
     INPUT POPUP
     ========================================= -->

<div id="inputMode">

    <div
        class="popup"
        id="popup"
    >


        <!-- TITLE -->

        <div class="popup-title">

            SILA MASUKKAN<br>
            NAMA ANDA

        </div>


        <!-- NAME -->

        <input
            id="nameInput"
            type="text"
            placeholder="Taip nama anda..."
            maxlength="40"
            autocomplete="off"
        >


        <!-- CONTINUE -->

        <button
            id="continueButton"
        >

            TERUSKAN

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


    </div>

</div>



<!-- =========================================
     FINAL NAME DISPLAY
     ========================================= -->

<div id="displayMode">

    <div id="displayName"></div>

</div>



<script>


/* =========================================
   READ MODE
   ========================================= */

const parameters =
    new URLSearchParams(
        window.location.search
    );


const mode =
    parameters.get("mode");



/* =========================================
   INPUT MODE
   ========================================= */

if (mode === "input") {


    const inputMode =
        document.getElementById(
            "inputMode"
        );


    const popup =
        document.getElementById(
            "popup"
        );


    const input =
        document.getElementById(
            "nameInput"
        );


    const continueButton =
        document.getElementById(
            "continueButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    /*
     * Show popup.
     */

    inputMode.style.display =
        "flex";


    /*
     * IMPORTANT:
     *
     * Remove the previous player's name.
     *
     * Every time a new player reaches
     * this page, they start with a
     * completely empty name field.
     */

    localStorage.removeItem(
        "playerName"
    );


    input.value = "";


    /*
     * Automatically put the cursor
     * into the name box.
     */

    setTimeout(
        function () {

            input.focus();

        },
        400
    );



    /* =====================================
       SAVE NAME
       ===================================== */

    function saveName() {


        const playerName =
            input.value.trim();


        /*
         * Don't allow an empty name.
         */

        if (playerName === "") {

            message.textContent =
                "Sila masukkan nama anda.";

            input.focus();

            return;

        }


        /*
         * Save the new player's name.
         */

        localStorage.setItem(
            "playerName",
            playerName
        );


        /*
         * Show confirmation.
         */

        message.textContent =
            "✓ NAMA BERJAYA DIREKODKAN";


        /*
         * Temporarily disable
         * the button.
         */

        continueButton.disabled =
            true;


        /*
         * Wait briefly so the player
         * sees the confirmation.
         */

        setTimeout(
            function () {


                /*
                 * Start popup exit animation.
                 */

                inputMode.classList.add(
                    "closing"
                );

                popup.classList.add(
                    "hide"
                );


                /*
                 * Remove popup after
                 * animation finishes.
                 */

                setTimeout(
                    function () {

                        inputMode.style.display =
                            "none";

                    },
                    350
                );


            },
            700
        );

    }



    /* =====================================
       CONTINUE BUTTON
       ===================================== */

    continueButton.addEventListener(
        "click",
        saveName
    );



    /* =====================================
       ENTER KEY
       ===================================== */

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                saveName();

            }

        }
    );



}


/* =========================================
   DISPLAY MODE
   ========================================= */

if (mode === "display") {


    document.getElementById(
        "displayMode"
    ).style.display =
        "block";


    const playerName =
        localStorage.getItem(
            "playerName"
        );


    const display =
        document.getElementById(
            "displayName"
        );


    if (playerName) {

        display.textContent =
            playerName;

    }

}

</script>


</body>

</html>
