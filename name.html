<!DOCTYPE html>
<html lang="ms">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<!-- Jockey One -->
<link
    href="https://fonts.googleapis.com/css2?family=Jockey+One&display=swap"
    rel="stylesheet"
>

<style>

    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;

        font-family: "Jockey One", sans-serif;

        overflow: hidden;

    }


    * {
        box-sizing: border-box;
    }


    /* =========================================
       INPUT MODE
       ========================================= */

    #inputMode {

        display: none;

        position: relative;

        width: 100%;
        height: 100%;

        align-items: center;
        justify-content: center;

        overflow: hidden;

    }


    /* =========================================
       DARK BACKDROP
       ========================================= */

    #inputMode::before {

        content: "";

        position: absolute;

        inset: 0;

        background: rgba(0, 0, 0, 0.18);

        opacity: 0;

        animation: backdropIn 0.35s ease forwards;

        z-index: 0;

    }


    #inputMode.closing::before {

        animation: backdropOut 0.35s ease forwards;

    }


    @keyframes backdropIn {

        to {

            opacity: 1;

        }

    }


    @keyframes backdropOut {

        from {

            opacity: 1;

        }

        to {

            opacity: 0;

        }

    }


    /* =========================================
       POPUP
       ========================================= */

    .popup {
        position: relative;
        z-index: 1;
        width: 95%;
        max-width: 520px;
        padding: 32px 32px 26px;
        text-align: center;
        background: linear-gradient(145deg, #123b74 0%, #0a2553 55%, #071a3b 100%);
        border: 3px solid #05d7f4;
        border-radius: 18px;
        box-shadow:
            0 0 0 2px rgba(255, 199, 44, 0.28),
            0 0 22px rgba(0, 214, 245, 0.38),
            0 18px 36px rgba(0, 0, 0, 0.48),
            inset 0 0 26px rgba(0, 181, 255, 0.09);
        opacity: 0;
        transform: scale(0.85);
        animation: popupIn 0.35s ease forwards;
    }

    /* Small HUD details, drawn without adding new HTML elements. */
    .popup::before,
    .popup::after {
        content: "";
        position: absolute;
        height: 5px;
        top: 13px;
        pointer-events: none;
        border-radius: 3px;
    }

    .popup::before {
        left: 18px;
        width: 56px;
        background: linear-gradient(90deg, #05d7f4 0 70%, #ffc72c 70% 85%, transparent 85%);
    }

    .popup::after {
        right: 18px;
        width: 42px;
        background: repeating-linear-gradient(90deg, #05d7f4 0 7px, transparent 7px 13px);
        opacity: 0.8;
    }

    @keyframes popupIn {

        to {

            opacity: 1;

            transform: scale(1);

        }

    }


    /* =========================================
       TITLE
       ========================================= */

    .popup-title {

        margin-bottom: 18px;

        padding: 0 20px;

        color: #ffffff;

        text-shadow: 0 2px 3px rgba(0, 0, 0, 0.55), 0 0 10px rgba(0, 210, 245, 0.2);

        font-size: 30px;

        line-height: 1.1;

    }


    /* =========================================
       NAME INPUT
       ========================================= */

    #nameInput {

        width: 100%;

        padding: 13px 18px;

        font-family: "Jockey One", sans-serif;

        font-size: 23px;

        text-align: center;

        color: #ffffff;

        background: #071e43;

        border: 2px solid #13c9ed;

        border-radius: 11px;

        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.25), 0 0 9px rgba(0, 215, 245, 0.12);

        outline: none;

        transition:
            transform 0.15s ease,
            border-color 0.15s ease;

    }


    #nameInput::placeholder {

        color: #96b9d4;

    }


    #nameInput:focus {

        border-color: #ffc72c;

        box-shadow: 0 0 12px rgba(255, 199, 44, 0.24);

        transform: scale(1.015);

    }


    /* =========================================
       CONTINUE BUTTON
       ========================================= */

    #continueButton {

        margin-top: 17px;

        padding: 11px 36px;

        font-family: "Jockey One", sans-serif;

        font-size: 22px;

        color: #062b50;

        background: #03cce9;

        border: 4px solid #ffc72c;

        border-radius: 30px;

        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.25), 0 0 12px rgba(0, 205, 240, 0.24);

        cursor: pointer;

        transition:
            transform 0.15s ease,
            background 0.15s ease;

    }


    #continueButton:hover {

        transform: scale(1.05);

        background: #48e3f5;

    }


    /* =========================================
       MESSAGE
       ========================================= */

    #message {

        height: 24px;

        margin-top: 10px;

        color: #ffc72c;

        font-size: 18px;

    }


    /* =========================================
       POPUP EXIT ANIMATION
       ========================================= */

    .popup.hide {

        animation:
            popupOut 0.35s ease forwards;

    }


    @keyframes popupOut {

        from {

            opacity: 1;

            transform: scale(1);

        }

        to {

            opacity: 0;

            transform: scale(0.85);

        }

    }


    /* =========================================
       FINAL DISPLAY MODE
       ========================================= */

    #displayMode {

        display: none;

        width: 100%;

        text-align: center;

    }


    #displayName {

        color: #ffc72c;

        font-family: "Jockey One", sans-serif;

        font-size: 40px;

        line-height: 1;

        text-align: center;

        white-space: nowrap;

        text-shadow:
            2px 2px 2px rgba(0, 0, 0, 0.35);

        opacity: 0;

        animation:
            nameFadeIn 1s ease-out 2s forwards;

    }


    @keyframes nameFadeIn {

        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }

    }

</style>

</head>


<body>


<!-- =========================================
     INPUT POPUP
     ========================================= -->

<div id="inputMode">

    <div
        class="popup"
        id="popup"
    >


        <!-- TITLE -->

        <div class="popup-title">

            SILA MASUKKAN<br>
            NAMA ANDA

        </div>


        <!-- NAME -->

        <input
            id="nameInput"
            type="text"
            placeholder="Taip nama anda..."
            maxlength="40"
            autocomplete="off"
        >


        <!-- CONTINUE -->

        <button
            id="continueButton"
        >

            TERUSKAN

        </button>


        <!-- MESSAGE -->

        <div id="message"></div>


    </div>

</div>



<!-- =========================================
     FINAL NAME DISPLAY
     ========================================= -->

<div id="displayMode">

    <div id="displayName"></div>

</div>



<script>


/* =========================================
   READ MODE
   ========================================= */

const parameters =
    new URLSearchParams(
        window.location.search
    );


const mode =
    parameters.get("mode");



/* =========================================
   INPUT MODE
   ========================================= */

if (mode === "input") {


    const inputMode =
        document.getElementById(
            "inputMode"
        );


    const popup =
        document.getElementById(
            "popup"
        );


    const input =
        document.getElementById(
            "nameInput"
        );


    const continueButton =
        document.getElementById(
            "continueButton"
        );


    const message =
        document.getElementById(
            "message"
        );


    /*
     * Show popup.
     */

    inputMode.style.display =
        "flex";


    /*
     * IMPORTANT:
     *
     * Remove the previous player's name.
     *
     * Every time a new player reaches
     * this page, they start with a
     * completely empty name field.
     */

    localStorage.removeItem(
        "playerName"
    );


    input.value = "";


    /*
     * Automatically put the cursor
     * into the name box.
     */

    setTimeout(
        function () {

            input.focus();

        },
        400
    );



    /* =====================================
       SAVE NAME
       ===================================== */

    function saveName() {


        const playerName =
            input.value.trim();


        /*
         * Don't allow an empty name.
         */

        if (playerName === "") {

            message.textContent =
                "Sila masukkan nama anda.";

            input.focus();

            return;

        }


        /*
         * Save the new player's name.
         */

        localStorage.setItem(
            "playerName",
            playerName
        );


        /*
         * Show confirmation.
         */

        message.textContent =
            "✓ NAMA BERJAYA DIREKODKAN";


        /*
         * Temporarily disable
         * the button.
         */

        continueButton.disabled =
            true;


        /*
         * Wait briefly so the player
         * sees the confirmation.
         */

        setTimeout(
            function () {


                /*
                 * Start popup exit animation.
                 */

                inputMode.classList.add(
                    "closing"
                );

                popup.classList.add(
                    "hide"
                );


                /*
                 * Remove popup after
                 * animation finishes.
                 */

                setTimeout(
                    function () {

                        inputMode.style.display =
                            "none";

                    },
                    350
                );


            },
            700
        );

    }



    /* =====================================
       CONTINUE BUTTON
       ===================================== */

    continueButton.addEventListener(
        "click",
        saveName
    );



    /* =====================================
       ENTER KEY
       ===================================== */

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                saveName();

            }

        }
    );



}


/* =========================================
   DISPLAY MODE
   ========================================= */

if (mode === "display") {


    document.getElementById(
        "displayMode"
    ).style.display =
        "block";


    const playerName =
        localStorage.getItem(
            "playerName"
        );


    const display =
        document.getElementById(
            "displayName"
        );


    if (playerName) {

        display.textContent =
          "Tahniah " +
          playerName +
          "! Anda Berjaya Bongkar Taktik Scammer!";


        /*
         * Keep the normal name size at 22px,
         * but shrink longer names until they fit.
         */

        function fitNameToSpace() {

            const maximumSize = 40;
            const minimumSize = 26;

            let currentSize = maximumSize;

            display.style.fontSize =
                currentSize + "px";


            while (
                display.scrollWidth >
                    display.clientWidth &&
                currentSize >
                    minimumSize
            ) {

                currentSize--;

                display.style.fontSize =
                    currentSize + "px";

            }

        }


        requestAnimationFrame(
            fitNameToSpace
        );

        window.addEventListener(
            "resize",
            fitNameToSpace
        );

    }

}

</script>


</body>

</html>
