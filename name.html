<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Sistem Nama Genially</title>

    <style>

        body {
            margin: 0;
            padding: 40px;

            font-family: Jockey One, sans-serif;
            text-align: center;

            background: #f5f5f5;
        }

        .box {
            max-width: 500px;
            margin: auto;

            padding: 30px;

            background: white;

            border-radius: 15px;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 90%;

            padding: 14px;

            font-size: 20px;

            border: 2px solid #333;
            border-radius: 8px;

            box-sizing: border-box;
        }

        button {
            margin-top: 20px;

            padding: 12px 30px;

            font-size: 18px;

            border: none;
            border-radius: 8px;

            cursor: pointer;
        }

        #message {
            margin-top: 20px;

            font-size: 16px;
        }

        #displayName {
            font-size: 40px;
            font-weight: bold;
        }

    </style>
</head>


<body>

<div class="box">

    <!-- ===================== -->
    <!-- INPUT MODE             -->
    <!-- ===================== -->

    <div id="inputMode">

        <h1>Sila Masukkan Nama Anda</h1>

        <input
            id="nameInput"
            type="text"
            placeholder="Taip nama di sini"
            maxlength="40"
        >

        <br>

        <button id="saveButton">
            Rekod Nama
        </button>

        <div id="message"></div>

    </div>


    <!-- ===================== -->
    <!-- DISPLAY MODE           -->
    <!-- ===================== -->

    <div id="displayMode" style="display:none;">

        <h1>Welcome!</h1>

        <div id="displayName"></div>

    </div>

</div>


<script>

    /*
     * Check the URL.
     *
     * Example:
     *
     * name.html?mode=input
     *
     * or
     *
     * name.html?mode=display
     */

    const urlParameters = new URLSearchParams(
        window.location.search
    );

    const mode = urlParameters.get("mode");


    // ==========================================
    // INPUT MODE
    // ==========================================

    if (mode === "input") {

        document.getElementById("inputMode").style.display = "block";


        const nameInput =
            document.getElementById("nameInput");

        const saveButton =
            document.getElementById("saveButton");

        const message =
            document.getElementById("message");


        saveButton.addEventListener("click", function () {

            const name = nameInput.value.trim();


            // Don't allow an empty name

            if (name === "") {

                message.textContent =
                    "Sila masukkan nama anda.";

                return;
            }


            // Save the name

            localStorage.setItem(
                "playerName",
                name
            );


            // Tell the user it worked

            message.textContent =
                "Rekod nama berjaya disimpan!";

        });

    }


    // ==========================================
    // DISPLAY MODE
    // ==========================================

    if (mode === "display") {

        document.getElementById("displayMode").style.display = "block";


        // Retrieve the saved name

        const savedName =
            localStorage.getItem("playerName");


        if (savedName) {

            document.getElementById("displayName")
                .textContent = savedName;

        } else {

            document.getElementById("displayName")
                .textContent = "Nama tidak dijumpai.";

        }

    }

</script>

</body>

</html>
