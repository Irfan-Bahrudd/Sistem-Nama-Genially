<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    * {
        box-sizing: border-box;
    }

    .container {
        width: 100%;
        text-align: center;
    }

    /* =========================
       INPUT MODE
       ========================= */

    #inputMode {
        display: none;
        width: 100%;
    }

    #nameInput {
        width: 90%;
        max-width: 420px;

        padding: 14px 18px;

        font-size: 20px;
        text-align: center;

        border: 2px solid #333;
        border-radius: 12px;

        outline: none;

        background: white;

        transition:
            border-color 0.2s ease,
            transform 0.2s ease;
    }

    #nameInput:focus {
        border-color: #666;
        transform: scale(1.01);
    }

    #saveButton {
        margin-top: 12px;

        padding: 12px 28px;

        font-size: 18px;
        font-weight: bold;

        border: none;
        border-radius: 12px;

        cursor: pointer;
    }

    #message {
        margin-top: 8px;

        min-height: 22px;

        font-size: 14px;
        font-weight: bold;
    }


    /* =========================
       DISPLAY MODE
       ========================= */

    #displayMode {
        display: none;
        width: 100%;
    }

    #displayName {
        margin: 0;

        font-size: 38px;
        font-weight: bold;

        line-height: 1.1;

        word-break: break-word;
    }
</style>
</head>


<body>

<div class="container">

    <!-- INPUT -->
    <div id="inputMode">

        <input
            id="nameInput"
            type="text"
            placeholder="Taip nama anda"
            maxlength="40"
            autocomplete="off"
        >

        <br>

        <button id="saveButton">
            Rekod Nama
        </button>

        <div id="message"></div>

    </div>


    <!-- DISPLAY -->
    <div id="displayMode">

        <div id="displayName"></div>

    </div>

</div>


<script>

    const parameters =
        new URLSearchParams(window.location.search);

    const mode =
        parameters.get("mode");


    // =========================
    // INPUT MODE
    // =========================

    if (mode === "input") {

        document.getElementById("inputMode")
            .style.display = "block";

        const input =
            document.getElementById("nameInput");

        const button =
            document.getElementById("saveButton");

        const message =
            document.getElementById("message");


        // Show previously saved name
        const existingName =
            localStorage.getItem("playerName");

        if (existingName) {
            input.value = existingName;
        }


        function saveName() {

            const playerName =
                input.value.trim();

            if (playerName === "") {

                message.textContent =
                    "Sila masukkan nama anda.";

                return;
            }

            localStorage.setItem(
                "playerName",
                playerName
            );

            message.textContent =
                "✓ Nama berjaya direkodkan";

            button.textContent =
                "✓ Direkodkan";
        }


        button.addEventListener(
            "click",
            saveName
        );


        input.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {
                    saveName();
                }

            }
        );


        // If user edits the name again,
        // reset the button/message.

        input.addEventListener(
            "input",
            function() {

                button.textContent =
                    "Rekod Nama";

                message.textContent =
                    "";

            }
        );

    }


    // =========================
    // DISPLAY MODE
    // =========================

    if (mode === "display") {

        document.getElementById("displayMode")
            .style.display = "block";

        const playerName =
            localStorage.getItem("playerName");

        const display =
            document.getElementById("displayName");


        if (playerName) {

            display.textContent =
                playerName;

        } else {

            display.textContent =
                "";

        }

    }

</script>

</body>
</html>
